# Install in the *test repository* at .github/workflows/krisha-feed-pages.yml.
# GitHub repository Settings -> Pages -> Build and deployment -> GitHub Actions.
name: Publish Krisha XML feed (test repository)
on:
  push:
    branches: [main]
    paths:
      - feed.xml
      - .github/workflows/krisha-feed-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static public content
        run: |
          test -s feed.xml
          mkdir -p _site
          cp feed.xml _site/feed.xml
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
